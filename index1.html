<!DOCTYPE html>
<html>
<head>
    <title>Swiggy</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style1.css">
</head>
<body>

    <div class="navbar">

        <div class="logo">
            <h2>Swiggy</h2>
        </div>

        <div class="location">
            <p>Setup your precise location</p>
            <span class="down"></span>
        </div>

        <div class="search">
            <input type="text" placeholder="Search for restaurant and food">
            <span class="search-icon"></span>
        </div>

        <div class="user">
            <div class="user-head"></div>
            <div class="user-body"></div>
        </div>

    </div>


    <div class="container">

        <div class="banner">

            <div class="food">
                <h2>Food</h2>
            </div>

            <h1>Order Online Delivery<br>Restaurants Near Me</h1>

        </div>


        <div class="categories">

            <div class="heading">

                <h2>What's on your mind?</h2>

                <div class="buttons">
                    <button onclick="scrollFood(-1)">←</button>
                    <button onclick="scrollFood(1)">→</button>
                </div>

            </div>


            <div class="food-list" id="foodList">

                <div class="item">
                    <img src="https://images.unsplash.com/photo-1579751626657-72bc17010498?w=300" alt="Pizza">
                    <h3>Pizza</h3>
                </div>

                <div class="item">
                    <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=300" alt="Burger">
                    <h3>Burger</h3>
                </div>

                <div class="item">
                    <img src="https://images.unsplash.com/photo-1563245372-f21724e3856d?w=300" alt="Momos">
                    <h3>Momos</h3>
                </div>

                <div class="item">
                    <img src="https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=300" alt="Cake">
                    <h3>Cake</h3>
                </div>

                <div class="item">
                    <img src="https://images.unsplash.com/photo-1512058564366-18510be2db19?w=300" alt="Noodles">
                    <h3>Noodles</h3>
                </div>

                <div class="item">
                    <img src="https://images.unsplash.com/photo-1569718212165-3a8278d5f624?w=300" alt="Pasta">
                    <h3>Pasta</h3>
                </div>

                <div class="item">
                    <img src="https://images.unsplash.com/photo-1563805042-7684c019e1cb?w=300" alt="Ice Cream">
                    <h3>Ice Cream</h3>
                </div>

            </div>

        </div>

    </div>


    

</body>
</html>
